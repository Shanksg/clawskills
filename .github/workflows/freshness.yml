name: Skills Freshness

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: mcp-server
      - run: npm run check:freshness
        working-directory: mcp-server
