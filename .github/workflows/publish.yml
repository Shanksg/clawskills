name: Publish

# Stage 2 of 2. Fires when a version bump lands on main — normally by merging
# the PR that release.yml opened. Tags the release and publishes to npm via
# OIDC (no stored token).
#
# Tags are not branch-protected, so pushing the tag from CI is fine; only
# pushes to main itself require a PR.

on:
  push:
    branches: [main]
    paths:
      - 'mcp-server/package.json'
  workflow_dispatch:

permissions:
  contents: write   # push the version tag
  id-token: write   # OIDC npm publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags to tell whether this version already shipped

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        working-directory: mcp-server

      # The registry is the source of truth for "already published", not the
      # git tag. Gating on the tag meant a publish that failed after tagging
      # could never be retried — the leftover tag suppressed every rerun.
      - name: Check whether this version is already on npm
        id: check
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if npm view "clawskills-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "clawskills-mcp@${VERSION} is already published — nothing to do."
            echo "needed=false" >> $GITHUB_OUTPUT
          else
            echo "clawskills-mcp@${VERSION} is not on npm — publishing."
            echo "needed=true" >> $GITHUB_OUTPUT
          fi

      # Everything below is skipped when package.json changed for a reason
      # other than a version bump (a dependency change, say).

      - name: Upgrade npm (OIDC trusted publishing requires npm 11.5.1+)
        if: steps.check.outputs.needed == 'true'
        run: npm install -g npm@latest
        env:
          NPM_CONFIG_USERCONFIG: /dev/null

      - name: Build
        if: steps.check.outputs.needed == 'true'
        run: npm ci && npm run build
        working-directory: mcp-server

      - name: Test
        if: steps.check.outputs.needed == 'true'
        run: npm test
        working-directory: mcp-server

      - name: Publish to npm
        if: steps.check.outputs.needed == 'true'
        run: npm publish --access public
        working-directory: mcp-server
        # No NODE_AUTH_TOKEN — OIDC handles auth automatically

      # Tag only after a successful publish, so the tag always means "this
      # version is on npm". Tolerates an existing tag so a retry cannot fail
      # here for a version that did publish.
      - name: Tag the release
        if: steps.check.outputs.needed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists locally — skipping tag creation."
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}" || echo "Tag push failed or tag already on remote; continuing."
          fi
