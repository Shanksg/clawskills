name: Prepare Release

# Stage 1 of 2. This workflow only opens a release PR — it never pushes to main
# and never publishes. Merging the PR it creates triggers release.yml, which
# publishes to npm and tags the commit.
#
# The publishing half deliberately lives in release.yml, not here: npm's
# trusted publisher config pins that filename. Keep the names as they are.
#
# main is protected ("changes must be made through a pull request"), so the
# previous design of committing the version bump directly to main could not
# work; it failed at the push step with GH006 before reaching publish.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write        # push the release branch
  pull-requests: write   # open the release PR

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump version in package.json
        id: version
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          echo "value=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        working-directory: mcp-server

      - name: Update ROADMAP.md version references
        run: |
          sed -i "s/\`clawskills-mcp\` v[0-9]*\.[0-9]*\.[0-9]*/\`clawskills-mcp\` v${{ steps.version.outputs.value }}/g" skills/ROADMAP.md
          sed -i "s/Live — v[0-9]*\.[0-9]*\.[0-9]*/Live — v${{ steps.version.outputs.value }}/g" skills/ROADMAP.md

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          BRANCH="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add mcp-server/package.json mcp-server/package-lock.json skills/ROADMAP.md
          git commit -m "Bump version to ${VERSION}"
          git push origin "$BRANCH"

          cat > /tmp/pr-body.md <<EOF
          Automated release PR for \`clawskills-mcp\` v${VERSION}.

          Merging this triggers **Release**, which publishes to npm via OIDC and tags \`v${VERSION}\`. Nothing is published until then.

          - Bumps \`mcp-server/package.json\` to ${VERSION}
          - Updates version references in \`skills/ROADMAP.md\`
          EOF

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release v${VERSION}" \
            --body-file /tmp/pr-body.md
