name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write   # push version commit + tag
  id-token: write   # OIDC npm publish

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (OIDC trusted publishing requires npm 11.5.1+)
        run: npm install -g npm@latest
        env:
          NPM_CONFIG_USERCONFIG: /dev/null

      - name: Bump version in package.json
        run: npm version ${{ inputs.bump }} --no-git-tag-version
        working-directory: mcp-server

      - name: Read new version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        working-directory: mcp-server

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mcp-server/package.json mcp-server/package-lock.json
          git commit -m "Bump version to ${{ steps.version.outputs.value }}"
          git tag v${{ steps.version.outputs.value }}
          git push origin main
          git push origin v${{ steps.version.outputs.value }}

      - name: Build
        run: npm ci && npm run build
        working-directory: mcp-server

      - name: Test
        run: npm test
        working-directory: mcp-server

      - name: Publish to npm
        run: npm publish --access public
        working-directory: mcp-server
        # No NODE_AUTH_TOKEN — OIDC handles auth automatically
