name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a token with push access (GITHUB_TOKEN works for public repos;
          # for protected branches you may need a PAT with contents:write)
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version in package.json
        run: npm version ${{ inputs.bump }} --no-git-tag-version
        working-directory: mcp-server

      - name: Read new version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        working-directory: mcp-server

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mcp-server/package.json mcp-server/package-lock.json
          git commit -m "Bump version to ${{ steps.version.outputs.value }}"
          git tag v${{ steps.version.outputs.value }}
          git push origin main
          git push origin v${{ steps.version.outputs.value }}
        # ↑ Pushing the tag triggers publish.yml automatically
